name: LifeTimeStats checks and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*-forever"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install the Lua 5.1 test runtime
        run: python -m pip install --disable-pip-version-check --prefer-binary lupa==2.8
      - name: Run the existing regression suite
        run: python tests/run.py
      - name: Run the observation-statistics regression suite
        run: python tests/expanded.py
      - name: Verify Journal paging and theme behavior
        run: python tests/journal.py
      - name: Verify the Adventure Guide
        run: python tests/guide.py
      - name: Verify trends, export, compartment and globals
        run: python tests/compendium.py
      - name: Verify the Characters page
        run: python tests/roster.py
      - name: Verify the minimap button and record repair
        run: python tests/minimap.py
      - name: Verify reputation, currencies, items, gathering, mail, goals and trends
        run: python tests/compendium_collections.py
      - name: Verify history, snapshots, size and exports
        run: python tests/history.py
      - name: Verify release packaging
        run: python tests/package_release.py

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out verified sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build versioned addon archive
        run: python scripts/package_release.py --tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/lifetimestats-release"
      - name: Publish ZIP, checksum and changelog as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/lifetimestats-release/LifeTimeStats-${GITHUB_REF_NAME#v}.zip" \
            "$RUNNER_TEMP/lifetimestats-release/LifeTimeStats-${GITHUB_REF_NAME#v}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LifeTimeStats $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/lifetimestats-release/release-notes.md" \
            --verify-tag \
            --latest
